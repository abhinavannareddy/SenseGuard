name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          check-latest: false
          cache: true

      - name: Verify Go module checksums
        run: go mod verify

      - name: Test application
        run: go test ./cmd/senseguard/...

      - name: Check application with go vet
        run: go vet ./cmd/senseguard/...

      - name: Run race detector
        run: go test -race ./cmd/senseguard/...

      - name: Measure application coverage
        run: go test -cover ./cmd/senseguard/...

      - name: Scan Go packages for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./cmd/senseguard/...

      - name: Test OPA policies
        run: docker run --rm -v "$PWD/policy:/policy:ro" openpolicyagent/opa:1.0.0 test /policy -v

      - name: Validate Compose configuration
        run: |
          CONSUMER_TOKENS="$(python3 -c 'import json,secrets; print(json.dumps({"ci-consumer": secrets.token_urlsafe(48)}))')" \
            docker compose config --quiet

      - name: Build application image
        run: docker build -t senseguard:ci .

      - name: Render and validate Kubernetes manifests
        run: |
          kubectl kustomize . > "$RUNNER_TEMP/senseguard-rendered.yaml"
          docker run --rm \
            -v "$RUNNER_TEMP/senseguard-rendered.yaml:/manifests.yaml:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /manifests.yaml
