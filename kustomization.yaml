apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - k8s/namespace.yaml
  - k8s/opa-deployment.yaml
  - k8s/senseguard-pvc.yaml
  - k8s/senseguard-deployment.yaml
  - k8s/senseguard-networkpolicy.yaml
configMapGenerator:
  - name: senseguard-policy
    namespace: senseguard
    files:
      - senseguard.rego=policy/senseguard.rego
      - opa_authz.rego=policy/opa_authz.rego
