apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: senseguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:1.0.0
          args: ["run", "--server", "--addr=0.0.0.0:8181", "/policy/senseguard.rego"]
          ports:
            - containerPort: 8181
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policy
          configMap:
            name: senseguard-policy
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: senseguard
spec:
  selector:
    app: opa
  ports:
    - port: 8181
      targetPort: 8181
