apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: senseguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opa
          image: openpolicyagent/opa:1.0.0
          args:
            - run
            - --server
            - --addr=https://0.0.0.0:8181
            - --diagnostic-addr=127.0.0.1:8282
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --tls-ca-cert-file=/tls/ca.crt
            - --authentication=tls
            - --authorization=basic
            - /policy/senseguard.rego
            - /policy/opa_authz.rego
          ports:
            - containerPort: 8181
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /opa
                - eval
                - --fail
                - --format=raw
                - --data=/policy/senseguard.rego
                - data.senseguard.healthcheck
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /opa
                - eval
                - --fail
                - --format=raw
                - --data=/policy/senseguard.rego
                - data.senseguard.healthcheck
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: opa-tls
              mountPath: /tls
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policy
          configMap:
            name: senseguard-policy
        - name: opa-tls
          secret:
            secretName: opa-server-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: senseguard
spec:
  selector:
    app: opa
  ports:
    - name: https
      port: 8181
      targetPort: 8181
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opa-from-senseguard-only
  namespace: senseguard
spec:
  podSelector:
    matchLabels:
      app: opa
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: senseguard
      ports:
        - protocol: TCP
          port: 8181
