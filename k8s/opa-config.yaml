apiVersion: v1
kind: ConfigMap
metadata:
  name: senseguard-policy
  namespace: senseguard
data:
  senseguard.rego: |
    package senseguard
    import rego.v1
    default allow := false
    allow if {
      input.consumer == "researcher"
      input.purpose == "crowd-analysis"
      input.mode in {"coarse", "noisy", "aggregate"}
    }
    allow if {
      input.consumer == "mall-manager"
      input.purpose == "occupancy-monitoring"
      input.mode == "aggregate"
    }
    healthcheck if {
      response := http.send({"url": "http://127.0.0.1:8282/health", "method": "get", "timeout": "1s"})
      response.status_code == 200
      allow with input as {"consumer": "researcher", "purpose": "crowd-analysis", "mode": "coarse"}
    }
  opa_authz.rego: |
    package system.authz
    import rego.v1
    default allow := false
    allow if {
      input.identity == "CN=senseguard-api"
      input.method == "POST"
      input.path == ["v1", "data", "senseguard", "allow"]
    }
    allow if {
      input.identity == "CN=senseguard-api"
      input.method == "GET"
      input.path == ["health"]
    }
