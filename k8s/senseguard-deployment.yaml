apiVersion: apps/v1
kind: Deployment
metadata:
  name: senseguard
  namespace: senseguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: senseguard
  template:
    metadata:
      labels:
        app: senseguard
    spec:
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: senseguard
          image: senseguard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: OPA_URL
              value: https://opa:8181
            - name: OPA_CA_FILE
              value: /opa-client/ca.crt
            - name: OPA_CLIENT_CERT_FILE
              value: /opa-client/tls.crt
            - name: OPA_CLIENT_KEY_FILE
              value: /opa-client/tls.key
            - name: REQUIRE_TLS
              value: "true"
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
            - name: CONSUMER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: senseguard-consumer-credentials
                  key: tokens
            - name: DEFAULT_PRIVACY_BUDGET
              value: "5"
            - name: REQUEST_PRIVACY_COST
              value: "1"
            - name: COARSE_GRID_SIZE
              value: "10"
            - name: NOISE_SCALE
              value: "3"
            - name: DATABASE_PATH
              value: /data/senseguard.db
          volumeMounts:
            - name: senseguard-data
              mountPath: /data
            - name: senseguard-tls
              mountPath: /tls
              readOnly: true
            - name: opa-client-tls
              mountPath: /opa-client
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: senseguard-data
          persistentVolumeClaim:
            claimName: senseguard-data
        - name: senseguard-tls
          secret:
            secretName: senseguard-tls
            defaultMode: 0440
        - name: opa-client-tls
          secret:
            secretName: senseguard-to-opa-client
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: senseguard
  namespace: senseguard
spec:
  selector:
    app: senseguard
  ports:
    - name: https
      port: 443
      targetPort: 8080
  type: ClusterIP
