apiVersion: apps/v1
kind: Deployment
metadata:
  name: senseguard
  namespace: senseguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: senseguard
  template:
    metadata:
      labels:
        app: senseguard
    spec:
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: senseguard
          image: senseguard:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: OPA_URL
              value: http://opa:8181
            - name: DEFAULT_PRIVACY_BUDGET
              value: "5"
            - name: REQUEST_PRIVACY_COST
              value: "1"
            - name: COARSE_GRID_SIZE
              value: "10"
            - name: NOISE_SCALE
              value: "3"
            - name: DATABASE_PATH
              value: /data/senseguard.db
          volumeMounts:
            - name: senseguard-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: senseguard-data
          persistentVolumeClaim:
            claimName: senseguard-data
---
apiVersion: v1
kind: Service
metadata:
  name: senseguard
  namespace: senseguard
spec:
  selector:
    app: senseguard
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
